name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # This package sits behind a parser that sits in every request. A
      # dependency here is a supply-chain risk for everyone downstream.
      - name: No dependencies
        run: |
          if [ -s go.sum ]; then
            echo "::error::adx gained a dependency"; cat go.sum; exit 1
          fi
